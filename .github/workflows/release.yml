name: Release

# Publishes dummkopf and @dummkopf/core to npm when a tag like v0.3.0 is pushed.
# Needs the repository secret NPM_TOKEN (an npm automation token with publish rights on @dummkopf).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: pnpm install --frozen-lockfile
      - name: Tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for package in core cli; do
            version=$(node -p "require('./packages/$package/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "packages/$package is at $version, the tag says $tag" >&2
              exit 1
            fi
          done
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:blackbox:dist
      - run: pnpm pack:check
      - run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
