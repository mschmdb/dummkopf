# Runs an existing German-language brain on dummkopf without migrating a single note.
# Copy to <your-brain>/dummkopf.toml, set repo.remote and adjust the paths to your folders.

schema_version = 1

[repo]
remote = "git@github.com:you/your-brain.git"
branch = "main"
commit_message = "Notizen aktualisieren"
sync_exclude = ["scripts"]

[layout]
sources = "quellen"

[scopes]
values = ["privat", "work"]
all = "both"
query_default = "both"
mixed_label = "gemischt"
link_barriers = ["work>privat"]

[status]
active = "aktiv"
archived = "archiv"

[sensitive]
marker = "> SENSIBEL"
always = ["topics/vertraulich/"]

[frontmatter]
key_fact = "kernfakt"
summary = "kurz"
aliases = "aliase"
updated = "stand"
status = "status"
period = "zeitraum"
entities = "entitaeten"
scope = "scope"

[ui]
locale = "de"
tone = "plain"

[context]
routes_file = "routen.json"

[extras]
codex_sync = true

[links]
output = "KANTEN.md"
entities_file = "entitaeten.txt"

[curator]
report_dir = "topics/kurator"
