# rcllr.toml: lives in the root of your brain repo.
# Every key is optional except where marked REQUIRED. Shown values are defaults.
# Unknown keys are an error, so a typo never silently disables a rule.

schema_version = 1                     # REQUIRED

[repo]
remote = "git@github.com:you/your-brain.git"   # without it the brain is local: commits, never pushes;
                                               # with it, sync refuses any other remote URL
remote_name = "origin"
branch = "main"
auto_push = true                       # false: commit locally, never push
commit_message = "Update notes"
sync_exclude = []                      # paths inside the committed folders that sync never stages

[layout]
topics = "topics"                      # topics/<topic>/README.md carries the topic scope
topic_readme = "README.md"
notes = "notes"                        # flat, no subfolders
bookmarks = "bookmarks"                # flat, no subfolders
archive = "archive"                    # notes here get status = archived
sources = "sources"                    # originals, never edited by rcllr
index = "INDEX.md"

[scopes]
values = ["private", "work"]           # REQUIRED, at least one
all = "both"                           # CLI keyword: --scope both searches every scope
query_default = "both"                 # --scope when the flag is omitted
mixed_label = "mixed"                  # shown for folders without a scope
require_on_new_topic = true            # a new topic README must set a scope
link_barriers = ["work>private"]       # a work note must not link to a private note

[status]
active = "active"                      # default for new notes; stale checks target it
archived = "archived"

[sensitive]
marker = "> SENSITIVE"                 # line at column 0, case-insensitive
paths_file = ".sensitive-paths"        # generated by the pre-commit hook, never by hand
always = []                            # path prefixes that are sensitive with or without marker

[frontmatter]                          # internal field -> key in your files
key_fact = "key_fact"
summary = "summary"
aliases = "aliases"
updated = "updated"
status = "status"
period = "period"
entities = "entities"
scope = "scope"
todo_placeholder = "TODO"              # written when key_fact is missing
summary_max = 160

[ui]
locale = "en"                          # "en" | "de": generated headings + language heuristics
tone = "plain"                         # "plain" | "cheeky"; --serious forces plain

[hooks]
report = "changes"                     # pre-commit report line: "changes" | "always" | "never"

[limits]
max_chars = 6000                       # output budget, CLI range 500..20000
find_limit = 3                         # CLI range 1..10
max_input_chars = 2000000
max_changes = 50                       # entries per ingest package
lock_timeout_s = 10
git_timeout_s = 60
stale_after_days = 56                  # `check` flags active notes older than this

[search.weights]
title = 8
aliases = 12
key_fact = 4
path = 3
body = 1
topic_readme_bonus = 30
curator_report_percent = 25            # reports under curator.report_dir score this share, unless the query names the curator
imported_percent = 25                  # imported agent memory (claude_memory.topic) scores this share

[context]
routes_file = "routes.json"            # optional; when set here, `check` warns if the file is missing

[extras]
links = true                           # cross-reference map (was: kanten)
curator = true                         # curation scan + LLM prompt template
codex_sync = true                      # Codex PostToolUse hook
claude_memory = false                  # mirror Claude Code auto memory with `rcllr import-memory`
codex_memory = false                   # mirror Codex memory (rollout summaries) the same way

[links]                                # options for the links extra
output = "LINKS.md"
entities_file = "entities.txt"         # optional; when set here, `check` warns if the file is missing
min_topics = 2
allow_outside = []                     # folders outside the note folders that links may point to, e.g. ["archive"]

[curator]                              # options for the curator extra
open_days = 28
stale_days = 56
report_dir = "topics/curator"
keep_key = "curator_keep"               # frontmatter date that hides a note from the scan until that day

[claude_memory]                        # options for the claude_memory extra
projects = []                          # project folders to import, e.g. ["~/Sites/shop"], or ["*"] for all
exclude = []                           # project folders to leave out, also with ["*"]
scope = "memory-claude"                # must be listed in scopes.values
topic = "claude-memory"                # topic folder that holds the mirror

[codex_memory]                         # options for the codex_memory extra
projects = []                          # folders whose Codex sessions get imported, or ["*"] for all
exclude = []                           # folders to leave out, also with ["*"]
scope = "memory-codex"                 # must be listed in scopes.values
topic = "codex-memory"                 # topic folder that holds the mirror
